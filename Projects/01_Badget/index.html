<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Badge Component | Project 01</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="container">
      <div class="badge-grid">
        <div class="badge-grid__row">
          <span class="badge badge--sm badge--neutral">Label</span>
          <span class="badge badge--md badge--neutral">Label</span>
          <span class="badge badge--lg badge--neutral">Label</span>
        </div>

        <div class="badge-grid__row">
          <span class="badge badge--sm badge--danger">Label</span>
          <span class="badge badge--md badge--danger">Label</span>
          <span class="badge badge--lg badge--danger">Label</span>
        </div>

        <div class="badge-grid__row">
          <span class="badge badge--sm badge--warning">Label</span>
          <span class="badge badge--md badge--warning">Label</span>
          <span class="badge badge--lg badge--warning">Label</span>
        </div>

        <div class="badge-grid__row">
          <span class="badge badge--sm badge--success">Label</span>
          <span class="badge badge--md badge--success">Label</span>
          <span class="badge badge--lg badge--success">Label</span>
        </div>

        <div class="badge-grid__row">
          <span class="badge badge--sm badge--brand">Label</span>
          <span class="badge badge--md badge--brand">Label</span>
          <span class="badge badge--lg badge--brand">Label</span>
        </div>
      </div>
    </main>
  </body>
</html>
